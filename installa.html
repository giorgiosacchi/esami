<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fb">
  <title>Installa Ricerca Esami</title>
  <link rel="manifest" href="./manifest.webmanifest?v=esami-install-1">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <script>
    (() => {
      try {
        if (localStorage.getItem('ricerca-esami.tema') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').content = '#0f172a';
        }
      } catch (_) {}
    })();
  </script>
  <style>
    :root { color-scheme: light; --bg: #f7f8fb; --card: #fff; --text: #1f2937; --muted: #526174; --border: #d8dbe2; }
    :root[data-theme="dark"] { color-scheme: dark; --bg: #0f172a; --card: #182235; --text: #e5e7eb; --muted: #acb8cb; --border: #38465d; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 24px 18px; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    main { width: min(100%, 450px); padding: 28px; border: 1px solid var(--border); border-radius: 18px; background: var(--card); }
    img { width: 64px; height: 64px; border-radius: 14px; display: block; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; margin: 0 0 12px; }
    p { line-height: 1.55; margin: 0 0 20px; }
    button { display: block; width: 100%; min-height: 48px; padding: 12px 16px; border: 0; border-radius: 10px; background: #2563eb; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    button:focus-visible, a:focus-visible { outline: 3px solid #60a5fa; outline-offset: 4px; }
    #status { min-height: 3.2em; margin: 16px 0 20px; color: var(--muted); font-size: .94rem; }
    a { color: var(--text); text-underline-offset: 3px; }
    .links { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; font-size: .92rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <img src="./icon-192.png" alt="" width="64" height="64">
    <h1>Installa Ricerca Esami</h1>
    <p>Apri Esami dalla schermata delle app e usa il programma anche senza connessione.</p>
    <button id="installEsami" type="button" disabled>Installa Esami</button>
    <p id="status" role="status" aria-live="polite">Preparazione dell’installazione…</p>
    <div class="links">
      <a href="./index.html?app=ricerca-esami">Apri il programma</a>
      <a href="./installa.html" id="retry" hidden>Riprova</a>
    </div>
  </main>
  <script>
    (() => {
      const button = document.getElementById('installEsami');
      const status = document.getElementById('status');
      const retry = document.getElementById('retry');
      let pendingPrompt = null;
      let requested = false;

      // La richiesta parte dal gesto dell'utente e dal manifest di Esami.
      // Non viene aperto il menu "Installa e crea scorciatoia" di Chrome.
      window.addEventListener('beforeinstallprompt', event => {
        event.preventDefault();
        pendingPrompt = event;
        button.disabled = false;
        button.hidden = false;
        retry.hidden = true;
        status.textContent = 'Premi Installa Esami e conferma nella finestra che si apre.';
      });

      button.addEventListener('click', async () => {
        if (!pendingPrompt) return;
        const prompt = pendingPrompt;
        pendingPrompt = null;
        requested = true;
        button.disabled = true;
        status.textContent = 'Completa la richiesta nella finestra di installazione.';
        try {
          const result = await prompt.prompt();
          const choice = result && result.outcome ? result : await prompt.userChoice;
          if (choice.outcome === 'accepted') {
            button.hidden = true;
            status.textContent = 'Richiesta accettata. Attendi che Android completi l’installazione di Esami.';
          } else {
            status.textContent = 'Installazione annullata. Puoi riprovare.';
            retry.hidden = false;
          }
        } catch (_) {
          status.textContent = 'Il browser non ha completato la richiesta. Puoi riprovare.';
          retry.hidden = false;
        }
      });

      window.addEventListener('appinstalled', () => {
        requested = true;
        pendingPrompt = null;
        button.hidden = true;
        retry.hidden = true;
        status.textContent = 'Richiesta accettata. Attendi che Android completi l’installazione di Esami.';
      });

      if (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone) {
        requested = true;
        button.hidden = true;
        status.textContent = 'Questa pagina è aperta nell’app. Puoi aprire il programma dal collegamento qui sotto.';
      } else if (!window.isSecureContext || !('serviceWorker' in navigator)) {
        requested = true;
        button.hidden = true;
        status.textContent = 'Apri questa pagina con un browser che supporta l’installazione delle app web.';
      } else {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'none' })
            .catch(() => {
              if (!requested && !pendingPrompt) {
                status.textContent = 'Preparazione non riuscita. Controlla la connessione e riprova.';
                retry.hidden = false;
              }
            });
        });
      }

      setTimeout(() => {
        if (requested || pendingPrompt) return;
        status.textContent = navigator.onLine
          ? 'Il browser non ha ancora reso disponibile l’installazione. Puoi riprovare o aprire il programma.'
          : 'Per installare Esami occorre una connessione a internet.';
        retry.hidden = false;
      }, 15000);
    })();
  </script>
</body>
</html>
